# Local backend for development with the host's Vite frontend.
services:
  backend:
    build:
      context: .
      dockerfile: docker/main/Dockerfile
      target: deps
    working_dir: /opt/frigate
    shm_size: "256mb"
    ports:
      - "127.0.0.1:8971:8971"
    volumes:
      - ./frigate:/opt/frigate/frigate:ro
      - ./migrations:/opt/frigate/migrations:ro
      - ./config:/config
      - ./debug:/media/frigate
    tmpfs:
      - /tmp/cache:size=1000000000
